<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>минион</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="gas" class="gas">
    <div class="gas-bubble" id="gasBubble"></div>
    <img src="img/шар.png" alt="Гас" class="gas-face-img" id="gasImg" draggable="false" />
  </div>

  <header class="topbar">
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0%</span>
    </div>
    <button id="resetBtn" class="reset-btn" title="Сбросить прогресс">↺</button>
  </header>

  <main id="app"></main>

  <script src="app.js"></script>
</body>
</html>
